<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hokkaido Trip Planner 2026</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-light: #eff6ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
            --accent: #d97706;
            --success: #16a34a;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .header {
            background: var(--primary);
            color: white;
            padding: 16px;
            border-radius: 16px;
            margin-bottom: 16px;
            text-align: center;
        }
        .header h1 { margin: 0 0 10px 0; font-size: 1.25rem; }
        .controls { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
        .btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-success { background: var(--success); border: none; }
        .btn-accent { background: var(--accent); border: none; }
        .day-card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
        }
        .day-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 8px;
            margin-bottom: 10px;
        }
        .day-date { font-weight: 700; color: var(--primary); }
        .day-title { font-weight: 600; font-size: 0.95rem; }
        .transit-badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }
        ul.details-list { padding-left: 18px; margin: 0; font-size: 0.9rem; }
        ul.details-list li { margin-bottom: 6px; }
        input, textarea {
            width: 100%;
            padding: 6px;
            margin: 4px 0;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .action-container { text-align: center; margin: 20px 0 40px 0; }
    </style>
</head>
<body>

<div class="header">
    <h1 id="app-title">🇯🇵 北海道行程 2026</h1>
    <div class="controls">
        <button class="btn" onclick="toggleLanguage()" id="lang-toggle-btn">English</button>
        <button class="btn btn-accent" onclick="toggleEditMode()" id="edit-toggle-btn">✏️ 编辑行程</button>
        <button class="btn btn-success" onclick="resetDefault()" id="reset-btn">🔄 恢复默认</button>
    </div>
</div>

<div id="itinerary-container"></div>

<div class="action-container">
    <button class="btn btn-accent" style="padding: 12px 24px; font-size: 1rem;" onclick="copyForWhatsApp()" id="copy-btn">📋 复制行程发 WhatsApp</button>
</div>

<script>
let currentLang = 'zh';
let isEditing = false;

const defaultData = {
    zh: [
        { date: "11月9日 (周一)", title: "抵达札幌", transit: "🚆 交通：JR快速Airport", details: ["13:00 抵达新千岁机场 (CTS)", "搭乘 JR 直达札幌入住酒店", "晚餐：自由选择（如札幌拉面）"] },
        { date: "11月10日 (周二)", title: "札幌市区漫游", transit: "🚇 交通：地下铁 + 步行", details: ["早/午餐：自由安排（二条市场或市区美食）", "下午：北海道大学 / 大通公园漫步", "晚餐：汤咖喱或烤肉（按喜好选择）"] },
        { date: "11月11日 (周三)", title: "小樽浪漫一日游", transit: "🚆 交通：JR 函馆本线", details: ["上午：白色恋人公园（可选）", "中午：小樽三角市场或市区用餐", "下午：堺町通商店街、小樽运河夜景"] },
        { date: "11月12日 (周四)", title: "旭川一日游 / 近郊游", transit: "🚆 交通：JR 特急（需划位）", details: ["去旭山动物园看动物，或改在札幌近郊温泉/神宫休闲"] },
        { date: "11月13日 (周五)", title: "札幌深度逛街与准备", transit: "🚇 交通：地下铁", details: ["市区采买、札幌站 Shopping", "提前划好明天去登别的特急车票"] },
        { date: "11月14-15日 (周六-日)", title: "登别温泉度假", transit: "🚆 交通：JR 特急全车指定席", details: ["入住日式温泉酒店，游览地狱谷，全天放松泡汤"] },
        { date: "11月16日 (周一)", title: "返回机场周边", transit: "🚆 交通：JR 列车", details: ["退房返回札幌或千岁站入住，购买伴手礼，准备回程"] },
        { date: "11月17日 (周二)", title: "顺利返程", transit: "🚆 交通：JR 快速 Airport", details: ["09:30 前往机场，逛国内线商场，13:30 航班起飞"] }
    ],
    en: [
        { date: "Nov 9 (Mon)", title: "Arrival & Sapporo", transit: "🚆 Transit: JR Rapid Airport", details: ["13:00 Arrive at CTS Airport", "Take JR to Sapporo & Check-in", "Dinner: Local Miso Ramen / Free choice"] },
        { date: "Nov 10 (Tue)", title: "Sapporo City Tour", transit: "🚇 Transit: Subway + Walk", details: ["Breakfast/Lunch: Local markets or cafes", "Afternoon: Hokkaido University & Odori Park", "Dinner: Soup Curry or Genghis Khan BBQ"] },
        { date: "Nov 11 (Wed)", title: "Otaru Day Trip", transit: "🚆 Transit: JR Hakodate Line", details: ["Morning: Shiroi Koibito Park (Optional)", "Noon: Lunch in Otaru", "Afternoon: Sakaimachi Street & Otaru Canal"] },
        { date: "Nov 12 (Thu)", title: "Asahikawa / Free Day", transit: "🚆 Transit: JR Limited Express", details: ["Visit Asahiyama Zoo or relax near Sapporo"] },
        { date: "Nov 13 (Fri)", title: "Shopping & Prep", transit: "🚇 Transit: Subway", details: ["Shopping around Sapporo Station", "Reserve tomorrow's train ticket to Noboribetsu"] },
        { date: "Nov 14-15 (Sat-Sun)", title: "Noboribetsu Onsen", transit: "🚆 Transit: JR Limited Express", details: ["Onsen Ryokan stay, visit Jigokudani, hot spring relaxation"] },
        { date: "Nov 16 (Mon)", title: "Return to Airport Area", transit: "🚆 Transit: JR Train", details: ["Return to Sapporo/Chitose hotel, final souvenir shopping"] },
        { date: "Nov 17 (Tue)", title: "Departure", transit: "🚆 Transit: JR Rapid Airport", details: ["09:30 Head to CTS Airport, 13:30 Flight departure"] }
    ]
};

function getStoredData() {
    const local = localStorage.getItem('hokkaido_plan_2026');
    return local ? JSON.parse(local) : JSON.parse(JSON.stringify(defaultData));
}

let planData = getStoredData();

function render() {
    const container = document.getElementById('itinerary-container');
    const data = planData[currentLang];
    
    document.getElementById('app-title').innerText = currentLang === 'zh' ? '🇯🇵 北海道行程 2026' : '🇯🇵 Hokkaido Itinerary 2026';
    document.getElementById('lang-toggle-btn').innerText = currentLang === 'zh' ? 'English' : '中文';
    document.getElementById('edit-toggle-btn').innerText = isEditing ? (currentLang === 'zh' ? '💾 保存更改' : '💾 Save Changes') : (currentLang === 'zh' ? '✏️ 编辑行程' : '✏️ Edit Plan');
    document.getElementById('copy-btn').innerText = currentLang === 'zh' ? '📋 复制行程发 WhatsApp' : '📋 Copy Text for WhatsApp';

    if (!isEditing) {
        container.innerHTML = data.map(item => `
            <div class="day-card">
                <div class="day-header">
                    <span class="day-date">${item.date}</span>
                    <span class="day-title">${item.title}</span>
                </div>
                <div class="transit-badge">${item.transit}</div>
                <ul class="details-list">
                    ${item.details.map(d => `<li>${d}</li>`).join('')}
                </ul>
            </div>
        `).join('');
    } else {
        container.innerHTML = data.map((item, idx) => `
            <div class="day-card">
                <input type="text" value="${item.date}" onchange="updateField(${idx}, 'date', this.value)">
                <input type="text" value="${item.title}" onchange="updateField(${idx}, 'title', this.value)">
                <input type="text" value="${item.transit}" onchange="updateField(${idx}, 'transit', this.value)">
                <textarea rows="3" onchange="updateDetails(${idx}, this.value)">${item.details.join('\n')}</textarea>
            </div>
        `).join('');
    }
}

function updateField(idx, field, value) {
    planData[currentLang][idx][field] = value;
}

function updateDetails(idx, text) {
    planData[currentLang][idx].details = text.split('\n').filter(line => line.trim() !== '');
}

function toggleEditMode() {
    isEditing = !isEditing;
    if (!isEditing) {
        localStorage.setItem('hokkaido_plan_2026', JSON.stringify(planData));
        alert(currentLang === 'zh' ? '行程已保存到手机！' : 'Plan saved!');
    }
    render();
}

function toggleLanguage() {
    currentLang = currentLang === 'zh' ? 'en' : 'zh';
    render();
}

function resetDefault() {
    if (confirm(currentLang === 'zh' ? '确定恢复到初始默认行程吗？' : 'Reset to default plan?')) {
        planData = JSON.parse(JSON.stringify(defaultData));
        localStorage.removeItem('hokkaido_plan_2026');
        render();
    }
}

function copyForWhatsApp() {
    const data = planData[currentLang];
    let text = `${currentLang === 'zh' ? '🇯🇵 北海道行程 2026' : '🇯🇵 Hokkaido Itinerary'}\n\n`;
    data.forEach(d => {
        text += `🗓️ *${d.date} - ${d.title}*\n`;
        text += `${d.transit}\n`;
        d.details.forEach(item => { text += `• ${item}\n`; });
        text += `\n`;
    });

    navigator.clipboard.writeText(text).then(() => {
        alert(currentLang === 'zh' ? '已复制最新行程！可直接粘贴到 WhatsApp。' : 'Copied to clipboard for WhatsApp!');
    });
}

render();
</script>
</body>
</html>
